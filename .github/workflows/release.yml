# The release in four columns. release creates the GitHub release (title and notes from the tag's section of CHANGELOG.md)
# and publishes the version every other job reads; nine build jobs then run at once, three per platform — payload (the shader
# translator), runtime (pkp_rt) and launcher (the Tauri app) — each on its own runner with only the toolchain it needs; three
# package jobs put their platform's three artifacts together; publish uploads every archive and writes one SHA256SUMS.txt.
# A tag v<x.y.z> does this; a manual run without release_tag only builds (artifacts).
# Manual runs with release_tag = v<x.y.z> publish the same way and GitHub creates the tag on the commit that was built. No test
# or pull request checks.
# Testing channel: a tag v<x.y.z>-alpha.N, -beta.N or -rc.N (run on the `testing` branch) publishes a GitHub PRERELEASE. The launcher's
# Stable channel never offers it; players who chose Testing do. Its notes come from its own CHANGELOG section if there is one, else from
# the Unreleased section, else a short generic text.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as this release (v<x.y.z> from main; v<x.y.z>-beta.N, -alpha.N or -rc.N, a Testing prerelease, from the testing branch; GitHub creates the tag). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: write

# One release per ref: a re-push or a manual dispatch cancels the run it replaces instead of queueing a second one behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 23.1.4
  RYUBING_COMMIT: a82350bb774f70fcbd41c9987bf67a3775409963
  # MoltenVK, the Vulkan driver of the macOS package: the release archive the runtime links against and the package ships
  MOLTENVK_VERSION: v1.4.2
  # package the third-party payload comes from (make-release.ps1): the upstream v0.1.1 repository is gone, so our own last release
  BASE_REPO: Dittobyte/Recompia
  BASE_RELEASE: v0.8.2
  # the release this run publishes: the pushed tag, or a manual run's release_tag; empty = build only
  REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:

  release:
    # A few seconds of work (parse CHANGELOG.md, one gh call): a Linux runner starts sooner and costs half a Windows one.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [ -n "$REL_TAG" ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            if printf '%s' "$REL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
              [ "$GITHUB_REF" = refs/heads/testing ] || { echo "::error::a Testing release_tag publishes from the testing branch only (this run: $GITHUB_REF)"; exit 1; }
            else
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release_tag publishes from main only (this run: $GITHUB_REF)"; exit 1; }
              printf '%s' "$REL_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release_tag '$REL_TAG' is not v<x.y.z> or v<x.y.z>-beta.N"; exit 1; }
            fi
          fi
          v=${REL_TAG#v}; v=${v:-0.0.0}
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PRERELEASE=$pre" >> "$GITHUB_ENV"
          # every other job reads these: one place validates the ref and parses the tag
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the version's own section of CHANGELOG.md; a Testing build may have none and falls back to Unreleased
          notes=$(awk -v v="$VERSION" '
            { sub(/\r$/, "") }
            $0 ~ "^## " v "([ \t(]|$)" {inside=1; next}
            inside && /^## / {exit}
            inside {print}
          ' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ] && [ "$PRERELEASE" = true ]; then
            notes=$(awk '{ sub(/\r$/, "") } $0 ~ "^## Unreleased" {inside=1; next} inside && /^## / {exit} inside {print}' CHANGELOG.md)
          fi
          if [ -z "${notes//[[:space:]]/}" ]; then
            if [ "$PRERELEASE" = true ]; then
              notes="A Testing build: newer than the latest stable release and less tested. Please report problems on GitHub with pkp.log and say you were on Testing."
            else
              echo "::error::CHANGELOG.md has no section '## $VERSION'"; exit 1
            fi
          fi
          printf '%s\n' "$notes" > build-notes.md
          if [ "$PRERELEASE" = true ]; then
            # what was merged since the previous release; a failure here never blocks the release
            if prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null) && [ -n "$prev" ]; then
              { git fetch --quiet --unshallow origin 2>/dev/null || true; git fetch --quiet origin "+refs/tags/$prev:refs/tags/$prev" 2>/dev/null || true; } || true
              changes=$(git log --merges --format='%H' "$prev..HEAD" 2>/dev/null | while read -r h; do
                subject=$(git show -s --format='%s' "$h")
                title=$(git show -s --format='%b' "$h" | awk 'NF{print; exit}')
                n=$(printf '%s' "$subject" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
                [ -n "$n" ] && [ -n "$title" ] && echo "- #$n $title"
              done || true)
              if [ -n "$changes" ]; then
                { echo "### Changes in this build"; printf '%s\n\n' "$changes"; cat build-notes.md; } > build-notes.new
                mv build-notes.new build-notes.md
              fi
            fi
            printf '\n\n### How to report\nOpen [a bug report](https://github.com/featureJosh/pokopia-recomp/issues/new?template=bug_report.yml), choose **Testing** as the channel, say which version you have, and attach `pkp.log` (and `setup.log` if Set up ran). Thank you for testing.\n' >> build-notes.md
          fi
          build=$(grep -m1 -E "^## ${VERSION//./\\.} \(build ([^)]+)\)" CHANGELOG.md | tr -d '\r' | sed -E 's/^## [^(]*\(build ([^)]+)\).*/\1/' || true)
          title="Pokopia Recomp $VERSION"
          if [ -n "$build" ]; then title="$title (build $build)"; elif [ "$PRERELEASE" = true ]; then title="$title (Testing)"; fi
          args=()
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          # A platform job that fails after this one leaves a release behind, so a re-run must not die here: update the release
          # it finds. A manual re-run builds a newer commit, and the release's source archives come from the tag, so the tag
          # moves with it (a pushed tag never moves: that run is the release).
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "release $REL_TAG exists: updating its title and notes"
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$REL_TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release edit "$REL_TAG" --title "$title" --notes-file build-notes.md "${args[@]}"
          else
            gh release create "$REL_TAG" --target "$GITHUB_SHA" --title "$title" --notes-file build-notes.md "${args[@]}"
          fi

  # The shader translator as a self-contained win-x64 publish: Set up runs it once per game folder to translate the shader
  # corpus, so every package carries it. Its own job, because the clone and the publish share nothing with the two compiles.
  windows-payload:
    needs: release
    outputs:
      version: ${{ needs.release.outputs.version }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ryujinx sources cache
        uses: actions/cache@v4
        with:
          path: refs/ryubing
          key: ryujinx-${{ env.RYUBING_COMMIT }}

      - name: Shader translator
        run: |
          if (-not (Test-Path refs/ryubing/.git)) { git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing }
          git -C refs/ryubing checkout -f $env:RYUBING_COMMIT
          ./tools/shaders/scripts/setup_ryujinx.ps1
          dotnet publish -c Release -r win-x64 --self-contained true tools/shaders/harness/SpirvHarness.csproj -o build/harness
          if ($LASTEXITCODE) { exit 1 }
          ./build/harness/spirv_harness.exe --help > $null
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: win-payload
          path: build/harness
          compression-level: 6

  # The Windows runtime: clang-cl against the MSVC SDK, ~600 translation units, the long pole of the platform.
  windows-runtime:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Third-party sources cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: nxrt-deps-win-v1

      # The MSI is a 400 MB download and install every run; the extracted tree is the same for a given version.

      - name: LLVM ${{ env.LLVM_VERSION }} (cache)
        id: llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ env.LLVM_VERSION }}-win64-v1

      - name: LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          $msi = "$env:RUNNER_TEMP\llvm.msi"
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile $msi -MaximumRetryCount 5 -RetryIntervalSec 30   # GitHub answers this large download with a 504 now and then
          Start-Process msiexec -Wait -ArgumentList '/i', $msi, '/qn'
          & 'C:\Program Files\LLVM\bin\clang-cl.exe' --version

      - name: LLVM on PATH
        run: |
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        run: choco install ninja -y --no-progress

      - name: libvpx cache
        id: vpx
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libvpx-x64-windows-static-v1

      - name: libvpx
        if: steps.vpx.outputs.cache-hit != 'true'
        run: C:\vcpkg\vcpkg.exe install libvpx:x64-windows-static

      - name: Texture tools (astc2bc7, astcdec DLLs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/textures/scripts/fetch_third_party.ps1
          ./tools/textures/scripts/build.ps1

      # github.com's direct release-asset downloads answered 504 for hours on 2026-11-08 while the release API kept working. CMake's FetchContent
      # reuses a file in NXRT_DEPS_DIR (%LOCALAPPDATA%\nxrt\deps) when its SHA-256 matches, so the two release assets are put there first through the API.
      # A failure here is not fatal: CMake then downloads them itself, as before.

      - name: Pre-fetch release assets (API route)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = Join-Path $env:GITHUB_WORKSPACE 'build\deps'
          New-Item -ItemType Directory -Force $d | Out-Null
          gh release download release-3.4.18 -R libsdl-org/SDL -p SDL3-3.4.18.tar.gz -D $d --clobber
          if ($LASTEXITCODE) { Write-Warning 'SDL3 pre-fetch failed; CMake will download it' }
          gh release download v1.5.7 -R facebook/zstd -p zstd-1.5.7.tar.gz -D $d --clobber
          if ($LASTEXITCODE) { Write-Warning 'zstd pre-fetch failed; CMake will download it' }
          exit 0

      # The four archive dependencies (runtime/cmake/gfx_deps.cmake) come from codeload.github.com, which kept working while github.com/.../archive
      # answered 503 on 2026-11-08. Each is checked against the same SHA-256 that CMake pins, extracted, and handed to CMake as its source
      # (FETCHCONTENT_SOURCE_DIR_*). Any problem here leaves that dependency to CMake's own download, as before.

      - name: Pre-fetch dependency sources (codeload)
        run: |
          $root = Join-Path $PWD 'build/depsrc'
          New-Item -ItemType Directory -Force $root | Out-Null
          $deps = @(
            @{ n = 'VULKAN_HEADERS'; u = 'https://codeload.github.com/KhronosGroup/Vulkan-Headers/zip/refs/tags/vulkan-sdk-1.4.363.0'; h = 'f4be95220ff0ee0b1c620301ff4fe9ae48592d71f4c30f2d5c571351a153ae81' },
            @{ n = 'VOLK'; u = 'https://codeload.github.com/zeux/volk/zip/refs/tags/vulkan-sdk-1.4.363.0'; h = '889b90fdcbe9cee7b118339d640c6895b7be5c920d309c44b744692063275b3d' },
            @{ n = 'VMA'; u = 'https://codeload.github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/zip/refs/tags/v3.4.0'; h = 'ce9a61ea5e72284ac9ccc152c214eef381ab57bfd7383f20232e5a652e3afda6' },
            @{ n = 'IMGUI'; u = 'https://codeload.github.com/ocornut/imgui/zip/refs/tags/v1.92.9b'; h = 'e1c46d676c2bcb7ced847ba27f50553e33a19db97b3cadaec7f8be64449139f8' }
          )
          $dargs = @()
          foreach ($d in $deps) {
            $zip = Join-Path $root "$($d.n).zip"
            curl.exe -fL --retry 5 --retry-delay 15 --retry-all-errors -o $zip $d.u
            if ($LASTEXITCODE -ne 0) { Write-Warning "$($d.n): download failed, CMake will fetch it"; continue }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $d.h) { Write-Warning "$($d.n): checksum differs, CMake will fetch it"; continue }
            $out = Join-Path $root $d.n
            Expand-Archive $zip $out -Force
            $inner = Get-ChildItem $out -Directory | Select-Object -First 1
            if (-not $inner) { Write-Warning "$($d.n): nothing extracted"; continue }
            $dargs += "-DFETCHCONTENT_SOURCE_DIR_$($d.n)=$($inner.FullName -replace '\\', '/')"
          }
          "CMAKE_DEP_ARGS=$($dargs -join ' ')" >> $env:GITHUB_ENV
          Write-Output "dependency overrides: $($dargs.Count) of $($deps.Count)"
          exit 0

      - name: sccache (the GitHub Actions cache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: pkp_rt.dll
        run: |
          $depArgs = @()
          if ($env:CMAKE_DEP_ARGS) { $depArgs = @($env:CMAKE_DEP_ARGS -split ' ' | Where-Object { $_ }) }
          cmake -S game-build -B build/rtdll -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
                -DPKP_RT_DLL=ON -DPKP_RELEASE=ON "-DPKP_VERSION=$env:VERSION" `
                "-DNXRT_DEPS_DIR=$env:GITHUB_WORKSPACE\build\deps" @depArgs
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/rtdll --target pkp_rt

      - uses: actions/upload-artifact@v4
        with:
          name: win-rt
          path: |
            build/rtdll/pkp_rt.dll
            build/rtdll/pkp_rt.lib
          compression-level: 6

  # The launcher: a Tauri app whose dependency tree is most of its build time.
  windows-launcher:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      # The pinned third-party archives (SDL3, zstd, Vulkan-Headers, volk, VMA, ImGui): CMake reuses a file whose SHA-256
      # matches, so a hit skips the downloads entirely.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Launcher
        working-directory: launcher
        run: |
          if ($env:REL_TAG) {   # the launcher window shows its own version
            $c = 'src-tauri/tauri.conf.json'; (Get-Content -Raw $c) -replace '"version": "[^"]*"', "`"version`": `"$env:VERSION`"" | Set-Content -NoNewline $c
            $t = 'src-tauri/Cargo.toml'; (Get-Content -Raw $t) -replace '(?m)^version = "[^"]*"', "version = `"$env:VERSION`"" | Set-Content -NoNewline $t
          }
          if ($env:GITHUB_REF -eq 'refs/heads/testing') {   # a Testing build has its own icon (the Stable icons stay in the repository untouched)
            Copy-Item -Force src-tauri/icons-testing/* src-tauri/icons/
          }
          npm ci
          # the Settings page against the runtime's schemas: among others every gameplay mod on by default (the runtime's own table is
          # held to that by PKP_GAMEPLAY_DEFAULTS_CHECK in the pkp_rt.dll step), so a test build's default cannot ship
          node scripts/test-settings-schema.mjs
          if ($LASTEXITCODE) { exit 1 }
          npm run tauri build
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: win-launcher
          path: launcher/src-tauri/target/release/pokopia-launcher.exe
          compression-level: 6

  # The Windows zip: the three artifacts around the base package (make-release.ps1), which carries the unchanged third-party
  # payload — Zig, embedded Python, the FSR/Streamline DLLs, astcdec, fonts, icons and licences.
  windows-package:
    needs: [windows-payload, windows-runtime, windows-launcher]
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.windows-payload.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Runtime from windows-runtime
        uses: actions/download-artifact@v4
        with:
          name: win-rt
          path: build/rtdll

      - name: Launcher from windows-launcher
        uses: actions/download-artifact@v4
        with:
          name: win-launcher
          path: launcher/src-tauri/target/release

      - name: Shader translator from windows-payload
        uses: actions/download-artifact@v4
        with:
          name: win-payload
          path: build/harness

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:BASE_RELEASE -R $env:BASE_REPO -p '*-win64.zip' -D build/base
          ./game-build/scripts/make-release.ps1 -Version $env:VERSION -Base (Get-Item build/base/*.zip).FullName -RtDir build/rtdll `
              -Launcher launcher/src-tauri/target/release/pokopia-launcher.exe -Harness build/harness -Out build/rel

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-win64
          path: build/rel/*.zip
          compression-level: 0

  # The shader translator as a self-contained linux-x64 publish.
  linux-payload:
    needs: release
    outputs:
      version: ${{ needs.release.outputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ryujinx sources cache
        uses: actions/cache@v4
        with:
          path: refs/ryubing
          key: ryujinx-${{ env.RYUBING_COMMIT }}

      - name: Shader translator
        run: |
          [ -d refs/ryubing/.git ] || git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing
          git -C refs/ryubing checkout -f "$RYUBING_COMMIT"
          bash tools/shaders/scripts/setup_ryujinx.sh
          dotnet publish -c Release -r linux-x64 --self-contained true tools/shaders/harness/SpirvHarness.csproj -o build/harness
          build/harness/spirv_harness --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: linux-payload
          path: build/harness
          compression-level: 6

  # The Linux runtime: libpkp_rt.so, the same sources as the other two, plus the export check the game exe links against.
  linux-runtime:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Third-party sources cache
        uses: actions/cache@v4
        with:
          path: build/deps
          key: nxrt-deps-linux-v1

      # 22.04 ships Python 3.10 and CMake 3.22; nxrecomp needs 3.11+ (find_package(Python3 3.11) in recomp/cmake/NxRecomp.cmake)
      # and the runtime needs CMake 3.25 (docs/linux-port.md §4).

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends g++ ninja-build pkg-config libvulkan-dev libx11-dev libxext-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libwayland-bin \
            libxkbcommon-dev libdrm-dev libudev-dev libasound2-dev libpulse-dev libgbm-dev libdbus-1-dev \
            libgl1-mesa-dev libfribidi-dev libthai-dev fonts-dejavu-core

      - name: CMake
        run: |
          python3 -m pip install --upgrade "cmake>=3.28" pillow
          cmake --version
          python3 --version

      - name: sccache (the GitHub Actions cache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Runtime (libpkp_rt.so)
        run: |
          cmake -S game-build -B build/rtdll -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
                -DPython3_EXECUTABLE="$(command -v python3)" \
                "-DNXRT_DEPS_DIR=$PWD/build/deps" \
                -DPKP_RT_DLL=ON -DPKP_RELEASE=ON "-DPKP_VERSION=$VERSION"
          cmake --build build/rtdll --target pkp_rt
          file build/rtdll/libpkp_rt.so
          # the exe resolves its exports through this list; a missing one links nothing at the player's Set up. The symbols carry
          # the version script's default version (pkp_rt_main@@PKP_RT_1), so the suffix comes off before comparing. The list is a
          # Mach-O one: two comment lines, a leading underscore per symbol, and CRLF line ends (git stores it that way).
          nm -D --defined-only build/rtdll/libpkp_rt.so | awk '{print $NF}' | sed 's/@.*//' | sort -u > build/exports.txt
          while IFS= read -r s; do
            s=${s%$'\r'}
            case "$s" in ''|'#'*) continue ;; esac
            grep -qx "${s#_}" build/exports.txt || { echo "::error::libpkp_rt.so does not export $s"; exit 1; }
          done < game-build/src/pkp_rt.exports

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rt
          path: build/rtdll/libpkp_rt.so
          compression-level: 6

  # The launcher as an AppImage, bundled with the static type2 runtime so it needs no libfuse2.
  linux-launcher:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            file g++ pkg-config
      - name: Launcher (AppImage)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1     # linuxdeploy is an AppImage itself; no FUSE on the runner
          NO_STRIP: true
        run: |
          if [ -n "$REL_TAG" ]; then   # the launcher window shows its own version
            sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          if [ "$GITHUB_REF" = "refs/heads/testing" ]; then   # a Testing build has its own icon (the Stable icons stay in the repository untouched)
            cp -f src-tauri/icons-testing/* src-tauri/icons/
          fi
          npm ci --no-audit --no-fund
          # linuxdeploy and its plugins are downloaded from GitHub while bundling; a failed download (HTTP 504, a missing plugin) fails the
          # job although nothing is wrong with the code (0.8.2 and beta.12). The compiled launcher is reused, so a retry only repeats the bundling.
          for try in 1 2 3; do
            if npm run tauri build -- --bundles appimage --config '{"bundle":{"active":true}}'; then break; fi
            [ "$try" = 3 ] && { echo "::error::the AppImage could not be bundled after 3 tries"; exit 1; }
            echo "::warning::AppImage bundling failed (try $try of 3), trying again in 30 s"
            rm -rf src-tauri/target/release/bundle/appimage
            sleep 30
          done
          ls -la src-tauri/target/release/bundle/appimage/

      - name: AppImage runtime without FUSE 2
        # linuxdeploy's runtime needs libfuse2, which Ubuntu 24.04 and others no longer install; the static type2 runtime
        # (pinned) needs none. The AppImage is that runtime followed by the same squashfs.
        env:
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL --retry 3 -o runtime-x86_64 "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
          ai=$(ls launcher/src-tauri/target/release/bundle/appimage/*.AppImage)
          off=$(APPIMAGE_EXTRACT_AND_RUN=1 "$ai" --appimage-offset)
          { cat runtime-x86_64; tail -c +$((off + 1)) "$ai"; } > "$ai.new"
          chmod 755 "$ai.new" && mv "$ai.new" "$ai"
          "$ai" --appimage-offset

      - name: Launcher artifact
        run: |
          ai=$(ls launcher/src-tauri/target/release/bundle/appimage/*.AppImage)
          mkdir -p work/play && cp "$ai" work/play/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-launcher
          path: |
            work/play/*.AppImage
          compression-level: 0

  # The Linux tar.gz: the AppImage, the runtime, the build kit and the shader translator, staged from this checkout (nothing
  # comes from another platform's build), then started once under Xvfb to prove it finds tools/.
  linux-package:
    needs: [linux-payload, linux-runtime, linux-launcher]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.linux-payload.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages
        run: python3 -m pip install --upgrade pillow   # make-linux.sh draws the keyboard and mouse prompt icons with it

      - name: Runtime from linux-runtime
        uses: actions/download-artifact@v4
        with:
          name: linux-rt
          path: build/rtdll

      - name: Shader translator from linux-payload
        uses: actions/download-artifact@v4
        with:
          name: linux-payload
          path: build/harness

      - name: Launcher from linux-launcher
        uses: actions/download-artifact@v4
        with:
          name: linux-launcher
          path: work/play

      - name: Restore executable bits
        run: |
          mkdir -p launcher/src-tauri/target/release/bundle/appimage
          mv work/play/*.AppImage launcher/src-tauri/target/release/bundle/appimage/
          chmod +x launcher/src-tauri/target/release/bundle/appimage/*.AppImage
          # an artifact carries no modes, and the launcher execs this apphost itself
          chmod +x build/harness/spirv_harness

      - name: Package
        run: |
          mkdir -p build/rel
          sh launcher/scripts/make-linux.sh build/rel "$VERSION"
          # what the launcher and Set up look for: a missing one is a broken package, not a slow one
          pkg="build/rel/PokopiaRecomp-$VERSION"
          for f in PokopiaLauncher.AppImage libpkp_rt.so README.txt tools/build/pkp_build.py tools/build/dump_hashes.json \
                   tools/build/sdk/libpkp_rt.so tools/build/sdk/pkp_stub.cpp tools/build/sdk/pkp_rt_api.h \
                   tools/build/sdk/fonts/DejaVuSans.ttf tools/build/sdk/kbm_icons tools/build/recomp/nxrecomp/__main__.py \
                   tools/harness/spirv_harness tools/shaders/extract_corpus.py assets/prompts/prompt_icons.pak; do
            test -e "$pkg/$f" || { echo "::error::missing $f in the package"; find "$pkg" -maxdepth 3 | head -40; exit 1; }
          done
          test -x "$pkg/tools/harness/spirv_harness"
          ls -la build/rel

      - name: Smoke test (the AppImage starts and finds tools/)
        run: |
          # The AppImage leaves the graphics stack to the host on purpose (linuxdeploy excludes libEGL/libGL: they have to
          # match the driver). A desktop has them through mesa; this runner does not, and webkit's GStreamer GL plugin is
          # linked against libEGL, so the launcher dies at load time with "libEGL.so.1: cannot open shared object file".
          # The host supplies the whole graphics/GL dispatch stack (glvnd + mesa), which is what a desktop has and this
          # runner does not: webkit's GL and ANGLE paths dlopen libEGL/libGL/libGLESv1_CM/libGLESv2/libGLX.
          sudo apt-get install -y -q --no-install-recommends xvfb libegl1 libgl1 libgles1 libgles2 libgl1-mesa-dri libvulkan1
          cd "build/rel/PokopiaRecomp-$VERSION"
          (APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a ./PokopiaLauncher.AppImage > ../launch.log 2>&1; echo "exit $?" >> ../launch.log) || true
          cat ../launch.log
          grep -q "exit 124" ../launch.log || { echo "the launcher did not keep running"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-linux-x64
          path: build/rel/*.tar.gz
          compression-level: 0

  # Everything the macOS package carries except the two files only macOS can build: the shader harness as a self-contained
  # osx-arm64 publish, MoltenVK, the lifter, the SDK sources and the prompt icons. Linux does it, so the macOS runners only
  # compile.
  macos-payload:
    needs: release
    outputs:
      version: ${{ needs.release.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ryujinx sources cache
        uses: actions/cache@v4
        with:
          path: refs/ryubing
          key: ryujinx-${{ env.RYUBING_COMMIT }}

      - name: Shader harness (self-contained osx-arm64)
        run: |
          mkdir -p work
          [ -d refs/ryubing/.git ] || git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing
          git -C refs/ryubing checkout -f "$RYUBING_COMMIT"
          bash tools/shaders/scripts/setup_ryujinx.sh          # the same staging the Linux package uses
          dotnet publish -c Release -r osx-arm64 --self-contained true tools/shaders/harness/SpirvHarness.csproj -o work/harness
          test -x work/harness/spirv_harness                   # a macOS binary: it cannot run here, only the publish can be checked

      - name: MoltenVK
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o work/moltenvk.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
          test -s work/moltenvk.tar
          tar -xf work/moltenvk.tar -C work
          mkdir -p work/moltenvk
          cp work/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib work/MoltenVK/LICENSE work/moltenvk/
          test -s work/moltenvk/libMoltenVK.dylib

      - name: Prompt icons
        run: |
          python3 -m pip install --user --break-system-packages pillow   # tools/kbm_icons.py draws them
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Payload
        run: sh launcher/scripts/make-payload.sh work/payload work/harness work/moltenvk

      - uses: actions/upload-artifact@v4
        with:
          name: macos-payload
          # work/moltenvk rides along: the macOS runner links the runtime against it, so it never downloads MoltenVK itself
          path: |
            work/payload
            work/moltenvk
          compression-level: 6

  # The macOS runtime dylib against the SDK's frameworks. It fetches MoltenVK itself rather than waiting for the payload job,
  # so all nine build jobs stay siblings.
  macos-runtime:
    needs: release
    runs-on: macos-latest          # arm64, the port's target (macos-14 was x64 and its image was retired on 2 November 2026)
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Third-party sources cache
        uses: actions/cache@v4
        with:
          path: work/deps
          key: nxrt-deps-macos-v1

      # The dylib links MoltenVK; the cache keeps the download off every run after the first.
      - name: MoltenVK cache
        id: mvk
        uses: actions/cache@v4
        with:
          path: work/moltenvk
          key: moltenvk-${{ env.MOLTENVK_VERSION }}-v1

      - name: MoltenVK
        if: steps.mvk.outputs.cache-hit != 'true'
        run: |
          mkdir -p work/mvk-src work/moltenvk   # not work/MoltenVK: macOS volumes are case-insensitive
          curl -fsSL --retry 3 --retry-delay 5 -o work/moltenvk.tar \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
          test -s work/moltenvk.tar
          tar -xf work/moltenvk.tar -C work/mvk-src
          cp work/mvk-src/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib work/mvk-src/MoltenVK/LICENSE work/moltenvk/
          test -s work/moltenvk/libMoltenVK.dylib

      - name: sccache (the GitHub Actions cache)
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Runtime dylib (libpkp_rt.dylib)
        run: |
          cmake -S game-build -B work/build/rtb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
                "-DNXRT_DEPS_DIR=$PWD/work/deps" "-DNXRT_MOLTENVK_DIR=$PWD/work/moltenvk" \
                -DPKP_RT_DLL=ON -DNXRT_BUILD_GFX=ON -DNXRT_GAMES=pkp
          cmake --build work/build/rtb --target pkp_rt -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: macos-rt
          path: work/build/rtb/libpkp_rt.dylib
          compression-level: 6

  # The launcher binary (no bundler: the release is a plain folder, not a .app).
  macos-launcher:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Launcher
        working-directory: launcher
        run: |
          if [ -n "$REL_TAG" ]; then   # the launcher window and the bundle show the release's version
            sed -i '' -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i '' -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          npm ci --no-audit --no-fund
          npm run tauri build -- --no-bundle   # the release is a plain folder, not a .app: only the binary is needed
          mkdir -p ../work/play
          cp src-tauri/target/release/pokopia-launcher ../work/play/PokopiaLauncher

      - uses: actions/upload-artifact@v4
        with:
          name: macos-launcher
          path: work/play/PokopiaLauncher
          compression-level: 6

  # The macOS zip: the payload the Linux job staged, the dylib and the launcher, in one folder — no .app, no signature.
  macos-package:
    needs: [macos-payload, macos-runtime, macos-launcher]
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.macos-payload.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Payload (built on Linux)
        uses: actions/download-artifact@v4
        with:
          name: macos-payload
          path: work          # restores work/payload and work/moltenvk

      - name: Runtime dylib from macos-runtime
        uses: actions/download-artifact@v4
        with:
          name: macos-rt
          path: work/build/rtb

      - name: Launcher from macos-launcher
        uses: actions/download-artifact@v4
        with:
          name: macos-launcher
          path: work/play

      # an artifact is a zip: the executable bit does not survive it

      - name: Launcher is executable
        run: chmod +x work/play/PokopiaLauncher

      - name: Package (zip)
        run: launcher/scripts/make-mac.sh work/play work/payload "$VERSION"

      - name: Check the package
        run: |
          zip="work/play/Recompia-$VERSION-macos-arm64.zip"
          test -s "$zip"
          rm -rf work/check && mkdir -p work/check
          unzip -q "$zip" -d work/check
          root="work/check/PokopiaRecomp-$VERSION"
          test -x "$root/PokopiaLauncher"
          file "$root/PokopiaLauncher" | grep -q arm64
          for f in tools/build/sdk/libpkp_rt.dylib tools/build/sdk/libvulkan.1.dylib tools/build/sdk/kbm_icons \
                   tools/build/sdk/fonts tools/build/pkp_build.py \
                   libpkp_rt.dylib "How to open Recompia.txt"; do
            test -e "$root/$f" || { echo "missing $f in the package"; ls -R "$root" | head -60; exit 1; }
          done
          # the launcher execs the apphost directly (host.rs), so presence is not enough
          test -x "$root/tools/harness/spirv_harness" || { echo "the shader harness is not executable"; exit 1; }
          # the in-place updater's package: update.rs takes PokopiaRecomp-<version>/ as the install root
          unzip -Z1 "$zip" | grep -qx "PokopiaRecomp-$VERSION/tools/build/pkp_build.py" || { echo "the zip has no tools/build at the package root"; exit 1; }
          # no .app and no signature: the zip is unpacked and the launcher started from there (the note explains Open Anyway)
          if unzip -Z1 "$zip" | grep -q '\.app/'; then echo "the zip carries an app bundle"; exit 1; fi
          du -h "$zip"

      - name: Checksums
        run: |
          cd work/play
          shasum -a 256 "Recompia-$VERSION-macos-arm64.zip" | sed -E 's/  / */' > macos.sha256
          cat macos.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-macos-arm64
          path: |
            work/play/Recompia-${{ env.VERSION }}-macos-arm64.zip
            work/play/macos.sha256
          compression-level: 0

  # The one place that writes into the release: it takes the archives the three package jobs produced, uploads them, and
  # writes one SHA256SUMS.txt over all of them. A platform job that failed leaves its archive out instead of failing this one.
  publish:
    needs: [windows-package, linux-package, macos-package]
    if: always() && !cancelled() && (github.ref_type == 'tag' || inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PokopiaRecomp-*
          path: build/assets
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd build/assets
          ls -la
          rm -f SHA256SUMS.txt
          archives=(./*.zip ./*.tar.gz)
          sha256sum -b "${archives[@]}" | sed -E 's#\./##' > SHA256SUMS.txt || true
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "::error::no release archives were built"; exit 1; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${archives[@]}" SHA256SUMS.txt --clobber
